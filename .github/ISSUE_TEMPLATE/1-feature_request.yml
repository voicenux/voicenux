name: 💡 Feature request
description: An idea to make Voicenux better.
labels:
- enhancement
body:
- type: checkboxes
  id: checks
  attributes:
    label: Before you start
    options:
    - label: I searched the issues and this is not requested yet.
      required: true
- type: textarea
  id: problem
  attributes:
    label: What problem would this solve?
    description: What are you trying to do, and what gets in the way?
  validations:
    required: true
- type: textarea
  id: idea
  attributes:
    label: What would you like?
    description: How it could work. A rough idea is fine. A new voice, an effect, a setting, or something else.
  validations:
    required: true
- type: textarea
  id: more
  attributes:
    label: Anything else?
    description: Mockups, screenshots, or other apps that do it well. Something for the Stream Deck plugin goes to https://github.com/voicenux/voicenux-plugin/issues.
