# AI voices: an RVC model of the character turns your voice into it. They need an NVIDIA
# graphics card and download with one click, see src/ai. The AI moves your pitch to the
# character's by itself, so `key` only shifts from there.

[[voice]]
id = "ai-spongebob"
name = "SpongeBob"
icon = "spongebob"
category = "ai"
description = "The cheerful fry cook from under the sea."
blocks = [{ effect = "ai", model = "SpongeBob" }]

