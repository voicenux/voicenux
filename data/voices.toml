# The voices that come with Voicenux.
#
# Every voice is a row of effect blocks. Effects and their settings are listed in
# src/dsp/blocks.rs. Settings left out use the default. Choices are written by
# name, for example `type = "High shelf"`.

# Characters

[[voice]]
id = "baby"
name = "Baby"
icon = "baby"
category = "characters"
description = "Tiny, high and a little wobbly."
blocks = [
  { effect = "pitch", semitones = 8, formant = 6 },
  { effect = "vibrato", rate = 7, depth = 25, random = 0.3 },
  { effect = "band", low = 180, high = 9000 },
]

