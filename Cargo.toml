[package]
name = "voicenux"
version = "0.1.0"
edition = "2024"
description = "Real-time voice changer and soundboard for Linux"
license = "BSD-3-Clause"
repository = "https://github.com/voicenux/voicenux"
publish = false

[dependencies]
adw = { version = "0.9.2", package = "libadwaita", features = ["v1_7"] }
anyhow = "1.0.104"
ashpd = { version = "0.13.13", default-features = false, features = ["async-io", "global_shortcuts"] }
async-channel = "2.5.0"
dirs = "7.0.0"
env_logger = "0.11.11"
futures-util = { version = "0.3.34", default-features = false }
gio = { version = "0.22", features = ["v2_80"] }
glib-unix = "0.22"
gtk = { version = "0.11.5", package = "gtk4", features = ["v4_16"] }
httparse = "1.10.1"
ksni = { version = "0.3.6", default-features = false, features = ["blocking", "async-io"] }
log = "0.4.34"
nnnoiseless = { version = "0.5.2", default-features = false }
pipewire = "0.10.1"
rtrb = "0.4.0"
rustfft = "6.4.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
symphonia = { version = "0.6.1", default-features = false, features = ["mp3", "ogg", "vorbis", "flac", "wav", "pcm", "aac", "isomp4", "adpcm"] }
toml = "1.1.8"
tungstenite = { version = "0.30.0", default-features = false, features = ["handshake"] }
ureq = { version = "3.4.2", features = ["json"] }

[profile.release]
lto = "thin"
codegen-units = 4
strip = true

[profile.dev]
# DSP code is far too slow without optimizations to run in real time.
opt-level = 2

[build-dependencies]
glib-build-tools = "0.22.8"
